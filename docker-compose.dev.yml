# Development stack — hot reload frontend + backend with PostgreSQL + MinIO
services:
  postgres:
    image: postgres:17-alpine
    container_name: niha0-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-niha0}
      POSTGRES_USER: ${POSTGRES_USER:-niha0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niha0}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U niha0 -d niha0"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: niha0-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_dev_data:/data

  # Optional: make realtime REDIS — set REALTIME_MODE=redis on backend
  redis:
    image: redis:7-alpine
    container_name: niha0-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles: ["redis"]

  backend:
    build:
      context: ./apps/niha0-backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/niha0
      SPRING_DATASOURCE_USERNAME: niha0
      SPRING_DATASOURCE_PASSWORD: niha0
      STORAGE_MODE: ${STORAGE_MODE:-minio}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_S3_BUCKET: niha0
      STORAGE_S3_PATH_STYLE: "true"
      STORAGE_S3_REGION: us-east-1
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./apps/niha0-frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./apps/niha0-frontend/src:/app/src:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_dev_data:
  minio_dev_data:
