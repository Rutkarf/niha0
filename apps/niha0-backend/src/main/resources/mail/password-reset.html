<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>Réinitialisation du mot de passe</title>
</head>
<body style="font-family: system-ui, sans-serif; background:#f6f7f9; color:#1a1a1a; padding:24px;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <tr><td>
      <p style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin:0 0 8px;">NIHAO</p>
      <h1 style="font-size:22px;margin:0 0 16px;">Réinitialiser votre mot de passe</h1>
      <p style="line-height:1.5;margin:0 0 24px;">
        Une demande de réinitialisation a été faite pour <strong>{{email}}</strong>.
        Ce lien expire bientôt. Si vous n’êtes pas à l’origine de cette demande, ignorez cet e-mail.
      </p>
      <p style="margin:0 0 24px;">
        <a href="{{actionUrl}}" style="display:inline-block;background:#0f766e;color:#fff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:600;">
          Choisir un nouveau mot de passe
        </a>
      </p>
      <p style="font-size:12px;color:#6b7280;line-height:1.4;word-break:break-all;">
        Ou copiez ce lien : {{actionUrl}}
      </p>
    </td></tr>
  </table>
</body>
</html>
