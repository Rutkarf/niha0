spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:true}

niha0:
  jwt:
    # Required — no default. Validated by ProdSecurityValidator.
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  security:
    demo-login-enabled: ${DEMO_LOGIN_ENABLED:false}
    # Cookie CSRF double-submit enabled in prod; Bearer Authorization still bypasses CSRF.
    csrf-enabled: ${CSRF_ENABLED:true}
  storage:
    mode: ${STORAGE_MODE:minio}
  ai:
    provider: ${AI_PROVIDER:openai}
    openai:
      allow-demo-fallback: ${AI_OPENAI_ALLOW_DEMO_FALLBACK:false}
  mail:
    mode: ${MAIL_MODE:smtp}
    from: ${MAIL_FROM:noreply@nihao.app}
  app:
    public-url: ${APP_PUBLIC_URL}
  billing:
    provider: ${BILLING_PROVIDER:sumup}
  realtime:
    mode: ${REALTIME_MODE:memory}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.sasurd.niha0: INFO
  pattern:
    # Key=value structured console logs for aggregation (Phase 21).
    console: "ts=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level logger=%logger{36} thread=%thread msg=%msg%n"
