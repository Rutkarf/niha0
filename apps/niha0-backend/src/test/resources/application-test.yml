spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.reactive.ReactiveOAuth2ClientAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration
  datasource:
    url: jdbc:h2:mem:niha0;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/test-migration

niha0:
  jwt:
    secret: test-secret-key-for-unit-tests-minimum-256-bits-required!!
  oauth2:
    enabled: false
  security:
    auth-rate-limit-enabled: false
    os-api-rate-limit-enabled: false
  billing:
    provider: stub
  mail:
    mode: log
  app:
    public-url: http://localhost:4200
  realtime:
    mode: memory
