groups:
  - name: niha0
    rules:
      - alert: Niha0InstanceDown
        expr: up{job="niha0-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NIHAO backend down"
          description: "Backend target has been unreachable for 2 minutes."
      - alert: Niha0HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="niha0-backend",status=~"5.."}[5m]))
            /
          sum(rate(http_server_requests_seconds_count{application="niha0-backend"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx rate on NIHAO"
      - alert: Niha0HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application="niha0-backend"}[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 2s"
